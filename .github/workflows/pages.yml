# Publica el sitio estatico en la rama gh-pages con cada push.
# GitHub Pages sirve esa rama en https://eleevatemx.github.io/gtahub/
#
# Solo dispara en la rama que trae el sitio vigente. La rama vieja
# (claude/gtahub-dashboard-vercel-ro68wg) todavia contiene el dashboard
# anterior y este job hace push -f a gh-pages, asi que un push alli
# devolveria el sitio publicado a la version anterior. Por eso no se lista.
name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - claude/claude-code-setup-u3fe4l
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar en gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f origin gh-pages
