# Despliega el sitio estatico en GitHub Pages con cada push.
# La URL queda en https://eleevatemx.github.io/gtahub/
name: Desplegar en GitHub Pages

on:
  push:
    branches: [claude/gtahub-dashboard-vercel-ro68wg, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
